<!DOCTYPE html>
<html>
<head>
  <title>Number Table</title>
  <style>
    body { font-family: Arial; padding: 30px; }
    table { border-collapse: collapse; width: 300px; }
    td { padding: 10px; border: 1px solid black; text-align: center; }
  </style>
</head>
<body>
<input type="number" id="inputnum"/>
<button onclick="table()">Enter</button>
<h2>Table of Numbers</h2>
<table id="numTable"></table>

<script>
    function table(){
  let output = "";
  let n=document.getElementById("inputnum").value;
  for (let i = 1; i <= 10; i++) {
    output += "<tr><td>" + i + "</td><td>" + (i * n) + "</td></tr>";
  }

  document.getElementById("numTable").innerHTML = output;
}
</script>

</body>
</html>
