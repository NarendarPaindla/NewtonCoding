<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<button id="btn">
    Click Me
</button>



<h1 id="result">
    Press Any Key
</h1>
<script>
    

const heading =
document.getElementById("result");

document.addEventListener(
    "keydown",
    (e)=>{

        heading.textContent =
        `You Pressed ${e.key}`;

    }
);
</script>

</body>
</html>
